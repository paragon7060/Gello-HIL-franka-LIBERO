[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gello-hil-franka-libero"
version = "0.2.0"
description = "GELLO human-in-the-loop joint teleoperation for Franka Panda in LIBERO"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Gello-HIL-franka-LIBERO contributors"}]
dependencies = [
  "numpy>=1.23,<2",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
export = ["h5py>=3.8"]
# 6.12.0 loses a None reference per void call on CPython 3.10/3.11.
# Use the matched Qt/Shiboken runtime validated by the ownership/Stop stress tests.
gui = ["PySide6-Essentials==6.8.3"]

[project.scripts]
gello-hil = "gello_hil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gello_hil = ["plans/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the original Ruff 0.5 CI rule set stable across newer Ruff releases.
select = ["E4", "E7", "E9", "F"]
