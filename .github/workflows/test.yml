name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e '.[dev,export,gui]' 'mujoco>=3.1,<4'
      - run: python -m pytest
      - run: python scripts/collector_gui_stop_stress.py --output /tmp/gello-stop-stress --cycles 3 --polls-per-cycle 1000
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m ruff check src tests
